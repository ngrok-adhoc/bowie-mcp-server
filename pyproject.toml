[project]
name = "bowie-mcp-server"
version = "0.2.0"
description = "Find, add, and rate dog parks and dog-friendly cafés with MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40,<2",
    "fastapi>=0.165.0,<1",
    "fastmcp>=4.2.2,<5",
    "pydantic>=2.14.3,<3",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.40,<2",
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.uv]
package = false
