# Publishes Bowie container images to GHCR for linux/amd64 and linux/arm64.
#
# Cut a release:
#   1. Set the version in pyproject.toml, run `uv lock`, and merge it to main.
#   2. Tag that commit: git tag -a vX.Y.Z origin/main -m "Bowie MCP server X.Y.Z"
#      then git push origin refs/tags/vX.Y.Z
#   The tag must be vMAJOR.MINOR.PATCH, match pyproject.toml, and point at a commit
#   on main. The workflow publishes vX.Y.Z, X.Y.Z, and sha-<full-commit-sha> tags.
#   Pushes to main that change image inputs only warm the build cache.
#
# Retry a failed release: rerun the workflow, or
#   gh workflow run publish-image.yml --ref vX.Y.Z
#
# Pull an exact version (the package must be public, or sign in with read:packages):
#   docker pull ghcr.io/<owner>/bowie-mcp-server:vX.Y.Z
name: Publish Bowie image

on:
  workflow_dispatch:
  push:
    # Main warms the build cache. Release tags publish images.
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - mcp_server.py
      - data/places.json
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: bowie-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the release tag to be on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point at a commit on main." >&2
            exit 1
          fi
      - name: Validate stable release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
             [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH and match pyproject.toml." >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=match,pattern=^v(.*)$,group=1
            type=sha,format=long
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.ref_type == 'tag' }}
          sbom: ${{ github.ref_type == 'tag' }}
